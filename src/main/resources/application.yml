spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/outbox_demo
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

# External API base URLs — override per environment
app:
  api:
    credit-bureau-url: http://localhost:9090
    card-provider-url: http://localhost:9091
    notification-url: http://localhost:9092
  outbox:
    poll-batch-size: 10
    max-retries: 3
    poll-delay-ms: 5000
  sftp:
    enabled: false
    host: localhost
    port: 22
    username: sftp-user
    password: changeme
    remote-directory: /inbound
    archive-directory: /archive
    error-directory: /error
    local-directory: /tmp/outbox-demo/sftp-inbound
    filename-pattern: "*.csv"
    poll-delay-ms: 5000

logging:
  level:
    com.demo.outbox: DEBUG
